name: ci
on:
  push:
  pull_request:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Proofs check
        working-directory: model
        run: lake build --wfail
      - name: Vectors are a pure render of the model
        working-directory: model
        run: |
          lake exe gen ../vectors
          git diff --exit-code -- ../vectors
          test -z "$(git status --porcelain -- ../vectors)"
      - name: The proof graph is a pure render of the proofs
        working-directory: model
        run: |
          lake exe proofs ../design/laws/proofs.json
          git diff --exit-code -- ../design/laws/proofs.json
          test -z "$(git status --porcelain -- ../design/laws/proofs.json)"

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The JS writer agrees on every vector
        run: node interop/js/check.mjs vectors

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The design pages are a pure render of design/, protocol/ and vectors/
        run: |
          node design/build.mjs
          git diff --exit-code -- out
          test -z "$(git status --porcelain -- out)"
      - name: The design build refuses every mutant it should
        run: node design/mutants.mjs
