name: ci
on:
  push:
  pull_request:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean
        run: |
          elan=https://raw.githubusercontent.com/leanprover/elan/master
          curl -sSfL "$elan/elan-init.sh" \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Proofs check
        working-directory: model
        run: lake build --wfail
      - name: Vectors are a pure render of the model
        working-directory: model
        run: |
          lake exe gen ../vectors
          git diff --exit-code -- ../vectors
          test -z "$(git status --porcelain -- ../vectors)"
      - name: Every vector's expect follows from its input alone
        working-directory: model
        run: lake exe run --check ../vectors
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fuzz adapters and batch transport check
        timeout-minutes: 1
        run: node --test interop/fuzz/*.test.mjs
      - name: The verified fixed fuzz corpus agrees
        timeout-minutes: 1
        run: >-
          node interop/fuzz/run.mjs --seed ci-1 --n 28 --no-shrink
          --out "$RUNNER_TEMP/loops-fuzz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-corpus
          path: ${{ runner.temp }}/loops-fuzz
          if-no-files-found: ignore
      - name: The proof graph is a pure render of the proofs
        working-directory: model
        run: |
          lake exe proofs ../design/laws/proofs.json
          git diff --exit-code -- ../design/laws/proofs.json
          test -z "$(git status --porcelain -- ../design/laws/proofs.json)"
      - name: The premise cases are a pure render of the model
        working-directory: model
        run: |
          lake exe boundaries ../design/laws/boundaries.json
          git diff --exit-code -- ../design/laws/boundaries.json
          test -z "$(git status --porcelain -- ../design/laws/boundaries.json)"

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The JS implementation agrees on every vector
        run: node interop/js/check.mjs vectors

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: >-
          The design pages are a pure render of design/, protocol/ and vectors/
        run: |
          node design/build.mjs
          git diff --exit-code -- out
          test -z "$(git status --porcelain -- out)"
      - name: The design build refuses every mutant it should
        run: node design/mutants.mjs
