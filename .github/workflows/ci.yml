name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lints
        run: >-
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust vectors and characterization
        run: cargo test --workspace
      - name: Rust documentation
        run: cargo doc --workspace --no-deps
      - name: Rust input-only evaluator
        run: cargo build -p loops-eval --bin loops-eval

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same pinned Rust setup as the Rust gate, without unused components.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Install Lean
        run: |
          base=https://raw.githubusercontent.com/leanprover/elan/master
          curl -sSfL "$base/elan-init.sh" \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Proofs check
        working-directory: model
        run: lake build --wfail
      - name: Vectors are a pure render of the model
        working-directory: model
        run: |
          lake exe gen ../vectors
          git diff --exit-code -- ../vectors
          test -z "$(git status --porcelain -- ../vectors)"
      - name: Every vector's expect follows from its input alone
        working-directory: model
        run: lake exe run --check ../vectors
      - name: Runtime checks
        working-directory: model
        run: lake exe checks ..
      - name: Model mutants
        working-directory: model
        run: node mutants.mjs
      - name: Fuzz adapters and batch transport check
        timeout-minutes: 1
        run: node --test interop/fuzz/*.test.mjs
      - name: Rust input-only evaluator for three-way fuzz
        working-directory: rust
        run: cargo build -p loops-eval --bin loops-eval
      - name: The verified fixed fuzz corpus agrees
        timeout-minutes: 2
        run: >-
          node interop/fuzz/run.mjs --rust --seed ci-1 --n 28
          --out "$RUNNER_TEMP/loops-fuzz"
      - name: Ratchet tests
        run: node --test interop/ratchets/*.test.mjs
      - name: Adapters retain library boundaries
        run: node interop/ratchets/adapters.mjs
      - name: Refusal codes have vector and shared fuzz coverage
        timeout-minutes: 3
        run: node interop/ratchets/refusal-coverage.mjs
      - name: Evidence import checks
        run: >-
          python3 -m unittest discover -s interop/fuzz/evidence -p 'test_*.py'
      - name: Mutation runner checks
        run: node --test model/mutate/run.test.mjs model/lens-order.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-corpus
          path: ${{ runner.temp }}/loops-fuzz
          if-no-files-found: ignore
      - name: The proof graph is a pure render of the proofs
        working-directory: model
        run: |
          lake exe proofs ../design/laws/proofs.json
          git diff --exit-code -- ../design/laws/proofs.json
          test -z "$(git status --porcelain -- ../design/laws/proofs.json)"
      - name: The premise cases are a pure render of the model
        working-directory: model
        run: |
          lake exe boundaries ../design/laws/boundaries.json
          git diff --exit-code -- ../design/laws/boundaries.json
          test -z "$(git status --porcelain -- ../design/laws/boundaries.json)"

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The JS implementation agrees on every vector
        run: node interop/js/check.mjs vectors
      - name: The JS reader guards hold
        run: node --test interop/js/*.test.mjs

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: >-
          The design pages are a pure render of design/, protocol/ and vectors/
        run: |
          node design/build.mjs
          git diff --exit-code -- out
          test -z "$(git status --porcelain -- out)"
      - name: The design build refuses every mutant it should
        run: node design/mutants.mjs
