[package]
name = "loops-eval"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
loops = { path = "../core" }
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
ed25519-dalek = "2"

[dev-dependencies]
# Output expectations contain exact Int sums, not binary64 input lexemes.
serde_json = { version = "1", features = ["arbitrary_precision"] }
flate2 = "1"
hex = "0.4"
