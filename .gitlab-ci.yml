# GitLab CI: the gates of .github/workflows/ci.yml, on the homelab runner.
#
# strange-loops-next is primary on GitLab from 2026-11-08, so merge requests are
# checked here. Keep the two files in step: a gate added to one belongs in the other.
# GitLab runs the same gates with four economies GitHub does not have: the model
# mutants run only when their inputs change (model-mutants below), the model gate
# runs in a prebuilt image (ci/Dockerfile) instead of installing toolchains, a
# merge request that changes nothing the rust, model and interop gates read skips
# them (gate-inputs below), and main does not re-run the gates for a merge request
# merge whose pipeline already passed on the same tree (merge-check below). GitHub
# runs every gate on every push.
#
# Every job is tagged `homelab` (the Docker executor). The instance's other runner,
# osxcompute-primary, is a macOS shell executor that also takes untagged jobs and
# ignores `image:`, so an untagged job could run there without its toolchain.

# What the CI image is built from. A pipeline whose changes touch these builds
# the image first; off main it is tagged with the commit, so a merge request
# never replaces the image main uses, and main can take the very image a merge
# request was tested with.
.image-inputs: &image-inputs
  - ci/Dockerfile
  - model/lean-toolchain

# Everything the rust, model and interop gates read. A merge request pipeline
# compares its changes with the target branch, so a merge request that changes
# none of these leaves those gates reading exactly the files they passed on in
# main, and skips them. What remains outside is the root documents and .github/.
# A gate that starts reading a path outside this list must have it added here, or
# a merge request could change that path unchecked. The root files named last do
# not exist yet: rustup, cargo, rustfmt, clippy and git each look for theirs in
# the directories above where they run, so adding one could change a gate. The skip is only in merge
# request pipelines: on a branch push `changes` compares with the previous push,
# which says nothing about the tree as a whole, so every other pipeline runs them.
.gate-inputs: &gate-inputs
  - design/**/*
  - interop/**/*
  - model/**/*
  - rust/**/*
  - vectors/**/*
  - protocol/**/*
  - ci/**/*
  - .gitlab-ci.yml
  - rust-toolchain
  - rust-toolchain.toml
  - .cargo/**/*
  - rustfmt.toml
  - .rustfmt.toml
  - clippy.toml
  - .clippy.toml
  - .gitattributes

# Main skips the gates for a tested merge. That is sound only with the project
# settings it relies on: merge method "merge commit with semi-linear history"
# (GitLab merges a branch only when it already contains main, so the merge
# commit's tree is the branch head's tree), "pipelines must succeed" with
# skipped pipelines not counting, and no one allowed to push to main. The title
# and trailer below only route the pipeline; merge-check then proves the claim
# from the commit graph and the API, and if it can't, the full gate runs anyway.
# A changed merge commit template or project path stops the routing matching,
# so main runs the full gate.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *image-inputs
      variables:
        CI_IMAGE: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # A merge request merged into main. Only main writes the caches.
    - if: >-
        $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        && $CI_COMMIT_TITLE =~ /^Merge branch '.+' into 'main'$/
        && $CI_COMMIT_MESSAGE =~ /\nSee merge request strange-loops\/strange-loops-next!\d+\s*$/
      variables:
        MERGED_MR: "true"
        CACHE_POLICY: pull-push
    # Any other main pipeline (web, scheduled, a child full gate) runs every gate.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CACHE_POLICY: pull-push
    - if: $CI_COMMIT_BRANCH
      changes: *image-inputs
      variables:
        CI_IMAGE: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA
    - if: $CI_COMMIT_BRANCH

variables:
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:main
  CACHE_POLICY: pull

default:
  tags: [homelab]
  interruptible: true

stages: [image, check]

# Every gate is left out of a tested merge's pipeline on main.
.not-merged: &not-merged
  if: $MERGED_MR
  when: never

# Kaniko builds without a Docker daemon or a privileged container.
ci-image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - *not-merged
    - changes: *image-inputs
  script:
    - >-
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY"
      "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR/ci"
      --dockerfile "$CI_PROJECT_DIR/ci/Dockerfile"
      --build-arg "LEAN_TOOLCHAIN=$(cat model/lean-toolchain)"
      --destination "$CI_IMAGE"
      --snapshot-mode=redo
      --compressed-caching=false

shadow-export:
  stage: check
  image: python:3.10-slim
  needs: []
  rules:
    - *not-merged
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tools/shadow/**/*
        - rust/cli/tests/fixtures/shadow/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: on_success
  script:
    - python3 -m unittest discover -s tools/shadow -p 'test_*.py'

.rust:
  stage: check
  # The release rust/rust-toolchain.toml names.
  image: rust:1.100-bookworm
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
    # No incremental state: it only grows the cached rust/target on the runner.
    CARGO_INCREMENTAL: "0"
  cache:
    key: rust
    paths: [.cargo-home/registry, rust/target]
    policy: $CACHE_POLICY
  before_script:
    - rustup component add rustfmt clippy
    - (cd rust && rustc --version)
    - export PATH="$CARGO_HOME/bin:$PATH"

rust:
  extends: .rust
  needs: []
  rules:
    - *not-merged
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *gate-inputs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: on_success
  script:
    - cd rust
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --all-features -- -D warnings
    - cargo test --workspace
    - cargo doc --workspace --no-deps
    - cargo build -p loops-eval --bin loops-eval

# The model jobs wait for the image stage, so a pipeline that rebuilds the
# image runs them in the image it built.
.model:
  stage: check
  image: $CI_IMAGE
  cache:
    key:
      prefix: model-lake
      files: [model/lean-toolchain]
    paths: [model/.lake]
    policy: $CACHE_POLICY

model:
  extends: .model
  rules:
    - *not-merged
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *gate-inputs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: on_success
  script:
    # Proofs check
    - (cd model && lake build --wfail)
    # Vectors are a pure render of the model
    - (cd model && lake exe gen ../vectors)
    - git diff --exit-code -- vectors
    - test -z "$(git status --porcelain -- vectors)"
    # Every vector's expect follows from its input alone
    - (cd model && lake exe run --check ../vectors)
    # Runtime checks
    - (cd model && lake exe checks ..)
    # The mutation catalogue names current source sites, and its runner works
    - timeout 120 node --test model/mutate/run.test.mjs
    # Fuzz adapters and batch transport check
    - timeout 300 node --test interop/fuzz/*.test.mjs
    # Rust input-only evaluator for three-way fuzz
    - (cd rust && cargo build -p loops-eval --bin loops-eval)
    # The verified fixed fuzz corpus agrees
    - timeout 120 node interop/fuzz/run.mjs --rust --seed ci-1 --n 28 --out "$CI_PROJECT_DIR/loops-fuzz"
    # The tick corpus agrees in Lean and Rust
    - timeout 120 node interop/fuzz/run.mjs --family tick --seed tick-ci-1 --n 288 --chunk-size 144 --out "$CI_PROJECT_DIR/loops-fuzz/tick"
    - timeout 120 node interop/fuzz/run.mjs --family slice --seed slice-ci-1 --n 384 --out rust/target/fuzz-slice
    # The proof graph is a pure render of the proofs
    - (cd model && lake exe proofs ../design/laws/proofs.json)
    - git diff --exit-code -- design/laws/proofs.json
    - test -z "$(git status --porcelain -- design/laws/proofs.json)"
    # The premise cases are a pure render of the model
    - (cd model && lake exe boundaries ../design/laws/boundaries.json)
    - git diff --exit-code -- design/laws/boundaries.json
    - test -z "$(git status --porcelain -- design/laws/boundaries.json)"
  artifacts:
    name: fuzz-corpus
    when: always
    paths: [loops-fuzz/]
    expire_in: 1 week

# Model mutants. mutants.mjs copies model/ (sources, lakefile, toolchain and the
# mutate/mutants.json catalogue it draws guard mutants from), builds the checks
# executable there, and runs it against the checkout, which reads only
# vectors/standard/es6-numbers.txt. Nothing else can change its outcome, so it
# runs when one of those, the image or this file changes. In a merge request
# pipeline the comparison is with the target branch; on a branch push, with the
# previous push; a web, scheduled or new-branch pipeline always runs it.
model-mutants:
  extends: .model
  cache:
    key:
      prefix: model-lake
      files: [model/lean-toolchain]
    paths: [model/.lake]
    policy: pull
  rules:
    - *not-merged
    - changes:
        - model/**/*
        - vectors/standard/es6-numbers.txt
        - ci/Dockerfile
        - .gitlab-ci.yml
  script:
    - (cd model && node mutants.mjs)

# The full mutation catalogue, on request only: run a pipeline with the variable
# MUTATION_FULL set (Build > Pipelines > New pipeline, or the API). It is not a
# gate and no merge waits for it. model/mutate/run.mjs applies each catalogue
# entry to the checkout in turn and builds. If generated vectors match, it runs
# `run --check` and then `checks`. A mutant that passes both survives. Parallel
# jobs take every nth catalogue entry. A shard fails only when an entry
# could not be judged (a timeout, a generator failure) or the source was not
# restored. A survivor does not fail it. A build rejection keeps that status and
# gains a second verdict from what runs without the laws: the generator, the
# vectors, `run --check` and `checks` (model/mutate/README.md). It is no verdict
# on the proofs, and the entries it leaves on proofs alone still need their logs
# read; mutation-report lists them. Results and logs are kept as artifacts, and
# mutation-report joins them. Each command gets
# MUTATION_TIMEOUT seconds, 600 unless set: on a busy runner a build that
# rebuilds most of the model passes the runner's own default of 180, and a
# timed-out entry is not judged. MUTATION_ONLY, a comma-separated list of entry
# ids, runs those entries alone, to judge again the ones a run could not.
model-mutants-full:
  extends: .model
  cache:
    key:
      prefix: model-lake
      files: [model/lean-toolchain]
    paths: [model/.lake]
    policy: pull
  parallel: 4
  timeout: 3h
  interruptible: false
  rules:
    - *not-merged
    - if: $MUTATION_FULL
  script:
    - >-
      node model/mutate/run.mjs
      --shard "$CI_NODE_INDEX/$CI_NODE_TOTAL"
      --timeout "${MUTATION_TIMEOUT:-600}"
      ${MUTATION_ONLY:+--only "$MUTATION_ONLY"}
      --output "$CI_PROJECT_DIR/mutation/results-$CI_NODE_INDEX.json"
  artifacts:
    name: mutation-shard-$CI_NODE_INDEX
    when: always
    paths: [mutation/]
    expire_in: 1 month

# Joins the shards and fails unless every catalogue entry, or every entry
# MUTATION_ONLY names, was judged exactly once.
mutation-report:
  stage: check
  image: node:22-bookworm
  needs: [model-mutants-full]
  interruptible: false
  rules:
    - *not-merged
    - if: $MUTATION_FULL
      when: always
  script:
    - node model/mutate/merge.mjs ${MUTATION_ONLY:+--only "$MUTATION_ONLY"} --output mutation/merged.json mutation/results-*.json
  artifacts:
    name: mutation-report
    when: always
    paths: [mutation/merged.json]
    expire_in: 1 month

interop:
  stage: check
  needs: []
  image: node:22-bookworm
  rules:
    - *not-merged
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *gate-inputs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: on_success
  script:
    # The JS implementation agrees on every vector
    - node interop/js/check.mjs vectors
    # The JS reader guards hold
    - node --test interop/js/*.test.mjs

# The design gate runs in every pipeline, whatever changed. It takes seconds, and
# "pipelines must succeed" needs a pipeline with at least one job, so without it
# a merge request that changes only documents could not merge.
design:
  stage: check
  needs: []
  image: node:22-bookworm
  rules:
    - *not-merged
    - when: on_success
  script:
    # The design pages are a pure render of their repository sources: they are not kept
    # in the repository, and two builds of one tree give the same bytes
    - node design/build.mjs
    - (cd out && find . -type f | sort | xargs sha256sum) > /tmp/pages.first
    - rm -rf out && node design/build.mjs
    - (cd out && find . -type f | sort | xargs sha256sum) | diff /tmp/pages.first -
    # The design build refuses every mutant it should
    - node design/mutants.mjs
    - node --test design/decisions/*.test.mjs design/front/*.test.mjs

# A tested merge's pipeline on main: check the claim, then only keep main's
# image and caches current. These jobs are not interruptible, so a quick second
# merge cannot cancel the first one's image promotion.
#
# merge-check passes only if this commit is a merge of exactly the previous
# main and a branch that already contained it, has that branch head's tree,
# GitLab records it as the merge of a merge request with that head, and the
# latest merge request pipeline on that head passed. That pipeline ran every
# gate that reads something the merge request changed. It compared with main as
# it was then, which the head contains, since a branch that contains the current
# main contains every earlier one. The gates it skipped read only files identical
# to that main's, where they passed. Then every gate has passed on this tree or
# on the very files it reads in this tree, as long as gate-inputs lists everything
# the gates read.
merge-check:
  stage: image
  image: node:22-bookworm
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $MERGED_MR
  script:
    - |
      fail() { echo "merge-check: $*; the full gate runs instead (full-gate)" >&2; exit 1; }
      set -- $(git rev-list --parents -n 1 HEAD)
      [ $# -eq 3 ] || fail "$CI_COMMIT_SHA has $(($# - 1)) parents, not 2"
      base=$2 head=$3
      [ "$base" = "$CI_COMMIT_BEFORE_SHA" ] || fail "first parent $base is not the previous main $CI_COMMIT_BEFORE_SHA"
      git merge-base --is-ancestor "$base" "$head" || fail "the merged head $head does not contain main $base"
      [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$head^{tree}")" ] || fail "the tree differs from the merged head $head"
      get() { curl -sSf -H "JOB-TOKEN: $CI_JOB_TOKEN" -o "$1" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/$2" || fail "cannot read $2"; }
      # GitLab marks the merge request merged just after it moves main.
      for wait in 0 10 20 30; do
        sleep $wait
        get mrs.json "repository/commits/$CI_COMMIT_SHA/merge_requests"
        mr=$(node -p "(require('./mrs.json').find(m => m.state === 'merged' && m.merge_commit_sha === '$CI_COMMIT_SHA'
          && m.sha === '$head' && m.target_branch === '$CI_DEFAULT_BRANCH') || {}).iid")
        [ "$mr" != undefined ] && break
      done
      [ "$mr" != undefined ] || fail "no merge request into main was merged as $CI_COMMIT_SHA from $head"
      get pipelines.json "pipelines?sha=$head&source=merge_request_event&per_page=1"
      status=$(node -p 'const p = require("./pipelines.json"); p.length ? `${p[0].id} ${p[0].status}` : "none"')
      [ "${status#* }" = success ] || fail "the latest merge request pipeline on $head is: $status"
      echo "merge-check: !$mr merged $head, whose pipeline ${status% *} passed, and this is its tree"
      echo "MR_HEAD_SHA=$head" > merge.env
  artifacts:
    reports:
      dotenv: merge.env

# When the merge changed the image inputs, the merge request pipeline built
# ci:<head sha> and ran the model gate in it. Main takes that image, not a
# rebuild (a rebuild would fetch a newer stable Rust and elan).
ci-image-promote:
  stage: image
  needs: [merge-check]
  image:
    name: gcr.io/go-containerregistry/crane/debug:v0.20.3
    entrypoint: [""]
  interruptible: false
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $MERGED_MR
      changes: *image-inputs
  script:
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - crane tag "$CI_REGISTRY_IMAGE/ci:$MR_HEAD_SHA" main

# Refresh the caches the gates read. These build what the gates build and
# assert nothing.
rust-cache:
  extends: .rust
  needs: [merge-check]
  interruptible: false
  rules:
    - if: $MERGED_MR
  script:
    - cd rust
    - cargo clippy --workspace --all-targets --all-features
    - cargo test --workspace --no-run
    - cargo doc --workspace --no-deps
    - cargo build -p loops-eval --bin loops-eval

model-cache:
  extends: .model
  needs:
    - merge-check
    - job: ci-image-promote
      optional: true
  interruptible: false
  rules:
    - if: $MERGED_MR
  script:
    - (cd model && lake build && lake build proofs boundaries)

# If merge-check or the promotion fails, run every gate on main after all, in a
# child pipeline that writes the caches and rebuilds ci:main if it must. The
# pipeline is still marked failed, so the failure is seen.
full-gate:
  stage: check
  needs:
    - merge-check
    - job: ci-image-promote
      optional: true
  rules:
    - if: $MERGED_MR
      when: on_failure
  variables:
    MERGED_MR: ""
  trigger:
    include: .gitlab-ci.yml
    strategy: depend
